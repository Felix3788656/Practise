
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A* Aircraft Pathfinding Visualizer</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f3f6fb;
    color: #172033;
    text-align: center;
    margin: 0;
    padding: 24px 12px;
  }
  h1 { margin-bottom: 8px; }
  p { color: #526078; }
  #grid {
    display: grid;
    grid-template-columns: repeat(20, minmax(0, 1fr));
    gap: 2px;
    max-width: 700px;
    margin: 22px auto;
  }
  .cell {
    aspect-ratio: 1;
    background: white;
    border: 1px solid #d6deea;
    border-radius: 2px;
  }
  .wall { background: #263248; }
  .open { background: #f5ce62; }
  .closed { background: #f39b62; }
  .path { background: #36b879; }
  .start { background: #3785ed; }
  .goal { background: #e75261; }
  button {
    margin: 5px;
    padding: 10px 16px;
    border: 0;
    border-radius: 7px;
    background: #245fca;
    color: white;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #174a9f; }
  #status { font-weight: bold; min-height: 24px; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    font-size: 13px;
  }
  .key {
    display: inline-block;
    width: 12px;
    height: 12px;
    margin-right: 4px;
    vertical-align: -1px;
  }
</style>
</head>
<body>

<h1>A* Aircraft Pathfinding</h1>
<p>Watch the algorithm search for a low-cost route around obstacles.</p>

<div>
  <button id="start">Start animation</button>
  <button id="pause">Pause</button>
  <button id="step">Next step</button>
  <button id="reset">Reset</button>
</div>

<div id="status">Ready to plan the route.</div>
<div id="grid"></div>

<div class="legend">
  <span><i class="key start"></i>Start</span>
  <span><i class="key goal"></i>Destination</span>
  <span><i class="key wall"></i>Obstacle</span>
  <span><i class="key open"></i>Frontier</span>
  <span><i class="key closed"></i>Explored</span>
  <span><i class="key path"></i>Final path</span>
</div>

<script>
const ROWS = 15, COLS = 20;
const start = {r: 7, c: 1};
const goal = {r: 7, c: 18};

const walls = new Set();
for (let r = 2; r <= 11; r++) {
  if (r !== 5) walls.add(`${r},5`);
}
for (let r = 3; r <= 13; r++) {
  if (r !== 10) walls.add(`${r},10`);
}
for (let r = 0; r <= 7; r++) {
  if (r !== 3) walls.add(`${r},15`);
}

const grid = document.getElementById("grid");
const statusBox = document.getElementById("status");

let cells = [];
let open = [];
let closed = new Set();
let cameFrom = new Map();
let gScore = new Map();
let finalPath = [];
let timer = null;
let finished = false;

const key = p => `${p.r},${p.c}`;
const same = (a, b) => key(a) === key(b);

function heuristic(a, b) {
  return Math.abs(a.r - b.r) + Math.abs(a.c - b.c);
}

function neighbours(p) {
  return [
    {r:p.r-1,c:p.c}, {r:p.r+1,c:p.c},
    {r:p.r,c:p.c-1}, {r:p.r,c:p.c+1}
  ].filter(n =>
    n.r >= 0 && n.r < ROWS &&
    n.c >= 0 && n.c < COLS &&
    !walls.has(key(n))
  );
}

function draw() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = {r,c};
      const k = key(p);
      const el = cells[r][c];

      el.className = "cell";
      if (walls.has(k)) el.classList.add("wall");
      if (open.some(n => key(n) === k)) el.className = "cell open";
      if (closed.has(k)) el.className = "cell closed";
      if (finalPath.some(n => key(n) === k)) el.className = "cell path";
      if (same(p,start)) el.className = "cell start";
      if (same(p,goal)) el.className = "cell goal";
    }
  }
}

function reset() {
  clearInterval(timer);
  timer = null;
  open = [{...start}];
  closed = new Set();
  cameFrom = new Map();
  gScore = new Map([[key(start), 0]]);
  finalPath = [];
  finished = false;
  statusBox.textContent = "Ready to plan the route.";
  draw();
}

function reconstructPath(current) {
  const path = [current];
  while (cameFrom.has(key(current))) {
    current = cameFrom.get(key(current));
    path.unshift(current);
  }
  return path;
}

function step() {
  if (finished) return;

  if (open.length === 0) {
    finished = true;
    clearInterval(timer);
    timer = null;
    statusBox.textContent = "No route found.";
    return;
  }

  // Choose the node with the lowest f = g + h.
  open.sort((a,b) =>
    (gScore.get(key(a)) + heuristic(a,goal)) -
    (gScore.get(key(b)) + heuristic(b,goal))
  );

  const current = open.shift();
  const ck = key(current);

  if (closed.has(ck)) {
    draw();
    return;
  }

  if (same(current, goal)) {
    finalPath = reconstructPath(current);
    finished = true;
    clearInterval(timer);
    timer = null;
    draw();
    statusBox.textContent =
      `Route found! ${finalPath.length - 1} steps.`;
    return;
  }

  closed.add(ck);

  for (const next of neighbours(current)) {
    const nk = key(next);
    if (closed.has(nk)) continue;

    const tentativeG = gScore.get(ck) + 1;

    if (tentativeG < (gScore.get(nk) ?? Infinity)) {
      cameFrom.set(nk, current);
      gScore.set(nk, tentativeG);

      if (!open.some(n => key(n) === nk)) {
        open.push(next);
      }
    }
  }

  draw();
  statusBox.textContent =
    `Searching... explored ${closed.size} nodes.`;
}

function buildGrid() {
  grid.innerHTML = "";
  cells = [];

  for (let r = 0; r < ROWS; r++) {
    cells[r] = [];
    for (let c = 0; c < COLS; c++) {
      const el = document.createElement("div");
      el.className = "cell";
      el.title = `Row ${r}, Column ${c}`;
      grid.appendChild(el);
      cells[r][c] = el;
    }
  }
}

document.getElementById("start").onclick = () => {
  if (finished || timer) return;
  timer = setInterval(step, 120);
};

document.getElementById("pause").onclick = () => {
  clearInterval(timer);
  timer = null;
};

document.getElementById("step").onclick = () => {
  clearInterval(timer);
  timer = null;
  step();
};

document.getElementById("reset").onclick = reset;

buildGrid();
reset();
</script>
</body>
</html>
